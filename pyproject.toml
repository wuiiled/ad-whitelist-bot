[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-whitelist-bot"
version = "1.0.0"
description = "Collect maintainer-confirmed false-positive domains from anti-AD / AWAvenue-Ads-Rule GitHub issues into a provenance-backed whitelist."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wuiiled" }]
keywords = ["adblock", "whitelist", "false-positive", "anti-AD", "AWAvenue"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
]
dependencies = []  # stdlib only, by design

[project.scripts]
ad-whitelist-bot = "ad_whitelist_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
