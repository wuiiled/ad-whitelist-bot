name: daily-update

on:
  schedule:
    - cron: "30 21 * * *"   # 05:30 UTC+8 daily
  workflow_dispatch:
    inputs:
      full:
        description: "Full issue backfill (slow, ~30-60 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ad-whitelist-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            ad-whitelist-bot run --full
          else
            ad-whitelist-bot run
          fi

      - name: Commit outputs
        run: |
          git config user.name "ad-whitelist-bot[bot]"
          git config user.email "ad-whitelist-bot[bot]@users.noreply.github.com"
          git add data/state.json output/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "bot: daily update $(date -u +%F) [skip ci]"
            git push
          fi
