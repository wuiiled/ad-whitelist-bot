name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 线上只跑必要的单版本冒烟;全量矩阵在本地覆盖
          python-version: "3.12"
      - name: Install (editable, stdlib-only package)
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
